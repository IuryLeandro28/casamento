<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casamento Italla e Diego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: url('https://s3-sa-east-1.amazonaws.com/img.panorama/blog/273223/filmes-de-romance-netflix-body.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .card {
            background-color: rgba(0, 0, 0, 0.8);
            border: none;
            border-radius: 15px;
        }
        .btn {
            border-radius: 50px;
        }
        footer p {
            color: white;
        }
        #upload-status {
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app" class="container py-5">
        <h1 class="text-center mb-4"><i class="fas fa-heart text-danger"></i> Bem-vindos ao Casamento de Italla e Diego! <i class="fas fa-heart text-danger"></i></h1>
        <p class="text-center fs-5">Grave uma mensagem especial para os noivos. Você pode visualizar o vídeo antes de enviar e até gravar novamente, se desejar.</p>
        
        <div id="video-recorder" class="card p-4 mb-4 shadow-lg">
            <h2 class="text-center"><i class="fas fa-video text-primary"></i> Grave sua mensagem</h2>
            <video id="video" class="w-100 border mb-3 rounded" width="640" height="480" autoplay></video>
            <div class="d-flex justify-content-center gap-3">
                <button id="start" class="btn btn-primary px-4"><i class="fas fa-play"></i> Iniciar Gravação</button>
                <button id="stop" class="btn btn-danger px-4" disabled><i class="fas fa-stop"></i> Parar Gravação</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-labelledby="videoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="videoModalLabel">Visualizar Vídeo Gravado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <video id="preview" class="w-100 border mb-3 rounded" controls></video>
                    <div class="mb-3">
                        <label for="videoName" class="form-label">Nome do Vídeo:</label>
                        <input type="text" id="videoName" class="form-control" placeholder="Digite o nome do vídeo">
                    </div>
                    <span id="upload-status" class="d-block mt-2"></span>
                </div>
                <div class="modal-footer">
                    <button id="reRecord" class="btn btn-warning px-4"><i class="fas fa-redo"></i> Gravar Novamente</button>
                    <button id="uploadButton" class="btn btn-success px-4"><i class="fas fa-upload"></i> Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-4">
        <p class="fs-5"><i class="fas fa-heart text-danger"></i> Com amor, Italla e Diego ❤️</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app/scripts/video-functions.js"></script>
</body>
</html>
